<div class="relative w-full min-h-screen bg-gray-100 overflow-hidden">
    <!-- Background Image -->
    <img src="assets/images/loginBanner.svg" alt="Auction Background"
        class="absolute inset-0 w-auto h-full max-w-none object-left object-contain z-0" />

    <!-- Logo -->
    <div class="absolute -left-5 -top-18">
        <img src="assets/images/logo.png" alt="AuctionSphere Logo" class="w-64 h-auto">
    </div>

    <div class="relative z-10 flex justify-end items-end h-full px-4 md:px-12 pt-20 pb-2 pr-8">
        <div class="w-full max-w-md bg-white/80 backdrop-blur-sm p-8 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold text-amber-600 mb-6 text-center">Login</h2>

            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" type="email" pInputText formControlName="email" placeholder="you@example.com"
                        class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500" />
                    <small *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
                        class="text-red-500 text-xs">Please enter a valid email.</small>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <p-password formControlName="password" [toggleMask]="true" feedback="false" styleClass="w-full"
                        placeholder="Enter your password" [inputStyle]="{ 'padding': '0.75rem 1rem', 'width': '100%' }">
                    </p-password>
                    <small *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
                        class="text-red-500 text-xs">Password is required.</small>
                </div>

                <!-- Remember Me & Forgot -->
                <!-- <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember-me" class="h-4 w-4 text-amber-500 border-gray-300 rounded">
                        <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
                    </div>
                    <div class="text-sm">
                        <a [routerLink]="['/user/forgot']" class="text-amber-600 hover:underline">Forgot password?</a>
                    </div>
                </div> -->
                <!-- forgot Pasword -->
                <div class="text-sm ml-auto  flex justify-end">
                    <a [routerLink]="['/user/forgot']" class="text-amber-600 hover:underline">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button pButton type="submit" label="Login"
                    class="w-full text-white font-semibold py-2 rounded-lg transition"
                    [ngStyle]="{ 'background-color': '#f59e0b' }">
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-4">
                Don't have an account?
                <a [routerLink]="['/user/signup']" class="text-amber-600 hover:underline cursor-pointer">Sign up</a>
            </p>
        </div>
    </div>
    <router-outlet />
</div>
