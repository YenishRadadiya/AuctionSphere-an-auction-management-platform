<div class="relative w-full min-h-screen bg-gray-100 overflow-hidden">



    <img src="assets/images/loginBanner.svg" alt="Auction Background"
        class="absolute inset-0 w-auto h-full max-w-none object-left object-contain z-0" />

    <div class="absolute -left-5 -top-18">
        <img src="assets/images/logo.png" alt="AuctionSphere Logo" class="w-64 h-auto">
    </div>

    <div class="relative z-10 flex justify-end items-end h-full px-4 md:px-12 pt-20 pb-2 pr-8">
        <div class="w-full max-w-md bg-white/80 backdrop-blur-sm p-8 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold text-amber-600 mb-6 text-center">Sign up</h2>

            <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-5">

                <!-- Username -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input id="username" type="text" pInputText formControlName="username"
                        class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500" />
                    <small *ngIf="signupForm.get('username')?.touched && signupForm.get('username')?.invalid"
                        class="text-red-500 text-xs">Username is required (5-20 alphanumeric characters).</small>
                </div>

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" type="email" pInputText formControlName="email"
                        class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-amber-500" />
                    <small *ngIf="signupForm.get('email')?.touched && signupForm.get('email')?.invalid"
                        class="text-red-500 text-xs">Enter a valid email.</small>
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <p-password formControlName="password" [toggleMask]="true" autocomplete="off" styleClass="w-full"
                        [inputStyle]="{ 'padding': '0.75rem 1rem', 'width': '100%' }">
                        <ng-template pTemplate="header">
                            <div class="font-semibold text-sm mb-4">Pick a password</div>
                        </ng-template>
                        <ng-template pTemplate="footer">
                            <p-divider />
                            <ul class="pl-2 ml-2 my-0 leading-normal text-sm">
                                <li>At least one lowercase</li>
                                <li>At least one uppercase</li>
                                <li>At least one number</li>
                                <li>Minimum 8 characters</li>
                            </ul>
                        </ng-template>
                    </p-password>
                    <small *ngIf="signupForm.get('password')?.touched && signupForm.get('password')?.invalid"
                        class="text-red-500 text-xs">Password must meet the criteria.</small>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm
                        Password</label>
                    <p-password id="confirmPassword" formControlName="confirmPassword" [feedback]="false"
                        styleClass="w-full" [inputStyle]="{ 'padding': '0.75rem 1rem', 'width': '100%' }"
                        placeholder="Retype your password" />
                    <small *ngIf="signupForm.hasError('notMatching') && signupForm.get('confirmPassword')?.touched"
                        class="text-red-500 text-xs">Passwords do not match.</small>
                </div>

                <!-- Submit Button -->
                <button pButton type="submit" label="Sign up"
                    class="w-full text-white font-semibold py-2 rounded-lg transition"
                    [ngStyle]="{ 'background-color': '#f59e0b' }"> <!-- amber-500 -->
                </button>

            </form>

            <p class="text-center text-sm text-gray-600 mt-4">
                Already have an account?
                <a [routerLink]="['/user/login']" class="text-amber-600 hover:underline cursor-pointer">Login</a>
            </p>
        </div>
    </div>

    <router-outlet />
</div>
