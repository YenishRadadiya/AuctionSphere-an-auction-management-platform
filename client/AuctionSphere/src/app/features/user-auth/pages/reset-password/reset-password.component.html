<div class="relative w-full min-h-screen bg-gray-100 overflow-hidden">
    <img src="assets/images/loginBanner.svg" alt="Auction Background"
        class="absolute inset-0 w-auto h-full max-w-none object-left object-contain z-0" />

    <div class="absolute -left-5 -top-18">
        <img src="assets/images/logo.png" alt="AuctionSphere Logo" class="w-64 h-auto">
    </div>

    <div class="relative z-10 flex justify-end items-end h-full px-4 md:px-12 pt-20 pb-2 pr-8">
        <div class="w-full max-w-md bg-white/80 backdrop-blur-sm p-8 rounded-xl shadow-lg">
            <h2 class="text-3xl font-bold text-amber-600 mb-6 text-center">Reset Password</h2>

            <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-5">
                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <p-password formControlName="password" [toggleMask]="true" autocomplete="off" styleClass="w-full"
                        [inputStyle]="{ 'padding': '0.75rem 1rem', 'width': '100%' }">
                        <ng-template pTemplate="header">
                            <div class="font-semibold text-sm mb-4">Pick a password</div>
                        </ng-template>
                        <ng-template pTemplate="footer">
                            <p-divider />
                            <ul class="pl-2 ml-2 my-0 leading-normal text-sm">
                                <li>At least one lowercase</li>
                                <li>At least one uppercase</li>
                                <li>At least one number</li>
                                <li>Minimum 8 characters</li>
                            </ul>
                        </ng-template>
                    </p-password>
                    <small *ngIf="resetForm.get('password')?.touched && resetForm.get('password')?.invalid"
                        class="text-red-500 text-xs">Password must meet the criteria.</small>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirm
                        Password</label>
                    <p-password id="confirmPassword" formControlName="confirmPassword" [feedback]="false"
                        styleClass="w-full" [inputStyle]="{ 'padding': '0.75rem 1rem', 'width': '100%' }"
                        placeholder="Retype your password" />
                    <small *ngIf="resetForm.hasError('notMatching') && resetForm.get('confirmPassword')?.touched"
                        class="text-red-500 text-xs">Passwords do not match.</small>
                </div>

                <button pButton type="submit" label="Reset" class="w-full" [ngStyle]="{ 'background-color': '#f59e0b' }"
                    [disabled]="resetForm.invalid" styleClass="p-button-warning"></button>
            </form>
        </div>
    </div>

    <router-outlet />
</div>
