<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
        <p-button label="Delete" icon="pi pi-trash" severity="danger" outlined (onClick)="deleteSelectedProducts()"
            [disabled]="!selectedProducts || !selectedProducts.length" />
    </ng-template>

    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (click)="downloadCSV()" />
    </ng-template>
</p-toolbar>

<p-table #dt [value]="products" [paginator]="true" [rows]="10" [globalFilterFields]="['title', 'category.name']"
    [rowHover]="true" [(selection)]="selectedProducts" dataKey="id" [rowsPerPageOptions]="[10, 20, 30]"
    [tableStyle]="{ 'min-width': '75rem' }" [exportFunction]="customExport"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} products" [showCurrentPageReport]="true">

    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="text-xl font-semibold">Manage Products</h5>
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </span>
        </div>
    </ng-template>

    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>
            <th pSortableColumn="title">Title <p-sortIcon field="title" /></th>
            <th>Image</th>
            <th pSortableColumn="category.name">Category <p-sortIcon field="category.name" /></th>
            <th>Status</th>
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>

    <ng-template #body let-product>
        <tr>
            <td>
                <p-tableCheckbox [value]="product" />
            </td>
            <td>{{ product.title }}</td>
            <td>
                <img [src]="product.main_image_url" alt="image" class="w-16 h-16 object-cover rounded shadow"
                    onerror="this.src='https://via.placeholder.com/64?text=No+Image'; this.onerror=null;" />
            </td>
            <td>{{ product.category?.name }}</td>
            <td>{{ product.status }}</td>
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                    (click)="editProduct(product)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                    (click)="deleteProduct(product)" />
            </td>
        </tr>
    </ng-template>
</p-table>

<!-- Dialog for Add/Edit -->
<p-dialog [(visible)]="productDialog" [style]="{ width: '500px' }" header="Product Details" [modal]="true"
    [closable]="false">

    <form [formGroup]="productForm" class="space-y-5">
        <div>
            <label for="title" class="block text-sm font-semibold">Title</label>
            <input id="title" type="text" pInputText formControlName="title" class="w-full" />
        </div>

        <div>
            <label for="description" class="block text-sm font-semibold">Description</label>
            <textarea id="description" pInputTextarea formControlName="description" rows="3" class="w-full"></textarea>
        </div>

        <div>
            <label class="block text-sm font-semibold">Main Category</label>
            <p-dropdown [options]="mainCategories" formControlName="main_category_id" optionLabel="name"
                optionValue="id" placeholder="Select Main Category" class="w-full" />
        </div>

        <div>
            <label class="block text-sm font-semibold">Sub Category</label>
            <p-dropdown [options]="subCategories" formControlName="sub_category_id" optionLabel="name" optionValue="id"
                placeholder="Select Sub Category" class="w-full" />
        </div>

        <div>
            <label class="block text-sm font-semibold">Status</label>
            <p-dropdown formControlName="status" [options]="[
                      { label: 'Draft', value: 'draft' },
                      { label: 'Active', value: 'active' },
                      { label: 'Inactive', value: 'inactive' }
                    ]" placeholder="Select Status" class="w-full" />
        </div>

        <div>
            <label class="block text-sm font-semibold">Image</label>
            <input type="file" accept="image/*" (change)="onFileChange($event)" class="block" />
            <img *ngIf="imagePreview" [src]="imagePreview" alt="preview"
                class="mt-3 w-32 h-32 object-cover rounded shadow" />
        </div>
    </form>

    <ng-template #footer>
        <div class="flex justify-end gap-3">
            <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
            <p-button label="Save" icon="pi pi-check" (click)="saveProduct()" />
        </div>
    </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
