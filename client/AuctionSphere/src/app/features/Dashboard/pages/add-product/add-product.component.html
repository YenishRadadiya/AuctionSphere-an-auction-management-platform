<div class="p-6 bg-white rounded-lg shadow-md max-w-2xl mx-auto mt-10">
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">

        <!-- Title -->
        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title</label>
            <input id="title" pInputText formControlName="title" class="w-full border rounded px-3 py-2" />
        </div>

        <!-- Description -->
        <div>
            <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
            <textarea id="description" pInputTextarea formControlName="description" rows="4"
                class="w-full border rounded px-3 py-2"></textarea>
        </div>

        <!-- Main Category -->
        <div>
            <label for="main_category_id" class="block text-sm font-medium text-gray-700 mb-1">Main Category</label>
            <p-dropdown [options]="mainCategories" formControlName="main_category_id" optionLabel="name"
                optionValue="id" placeholder="Select Main Category" class="w-full">
            </p-dropdown>
        </div>

        <!-- Sub Category -->
        <div>
            <label for="sub_category_id" class="block text-sm font-medium text-gray-700 mb-1">Sub Category</label>
            <p-dropdown [options]="subCategories" formControlName="sub_category_id" optionLabel="name" optionValue="id"
                placeholder="Select Sub Category" class="w-full">
            </p-dropdown>
        </div>

        <!-- Image Upload -->
        <div>
            <label for="image" class="block text-sm font-medium text-gray-700 mb-1">Image</label>
            <input type="file" id="image" accept="image/*" (change)="onFileSelect($event)"
                class="block w-full text-sm border border-gray-300 rounded-lg cursor-pointer" #fileInput />

            <div *ngIf="imagePreview" class="mt-4">
                <img [src]="imagePreview" alt="Preview" class="w-32 h-32 object-cover rounded shadow" />
                <button type="button" class="mt-2 text-red-500 text-sm underline" (click)="removeImage($event)">
                    Remove Image
                </button>
            </div>
        </div>

        <!-- Submit -->
        <div class="text-right">
            <button pButton type="submit" label="Submit" icon="pi pi-check" class="px-6 py-2"></button>
        </div>
    </form>
</div>
