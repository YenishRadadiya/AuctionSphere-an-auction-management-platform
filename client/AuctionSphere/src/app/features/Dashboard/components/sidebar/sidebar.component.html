<aside
    class="fixed top-20 left-0 h-[calc(100%-5rem)] w-64 bg-amber-50 border-r border-amber-200 shadow-md rounded-r-xl mt-4">
    <div class="p-4 flex justify-between items-center border-b border-gray-200">
        <span class="text-xl font-semibold text-amber-600">Menu</span>
        <button (click)="toggleSidebar()" class="text-amber-500 hover:text-amber-700 lg:hidden">
            <i class="pi pi-times"></i>
        </button>
    </div>

    <nav class="p-4">
        <ul class="space-y-2">
            <!-- <li>
                <a
                    class="flex items-center gap-2 p-2 rounded-lg transition-colors cursor-pointer hover:bg-amber-100 text-slate-800">
                    <i class="pi pi-home"></i>
                    <span>Dashboard</span>
                </a>
            </li> -->

            <li *ngFor="let item of menuItems" class="relative">
                <a [routerLink]="item['path']" class=" flex items-center gap-2 p-2 rounded-lg transition-colors cursor-pointer hover:bg-amber-100
                    text-slate-800"
                    [ngClass]="{ 'bg-amber-200 text-slate-800 font-semibold': selectedMenu === item.label }"
                    (click)="item['children'] ? toggleChildMenu(item) : null">
                    <i [ngClass]="item.icon + ' text-slate-800'"></i>
                    <span>{{ item.label }}</span>
                    <i *ngIf="item['children']" class="pi pi-chevron-down ml-auto"
                        [ngClass]="{'rotate-180': item['showChildren']}"></i>
                </a>

                <!-- Child Menu Items -->
                <ul *ngIf="item['children'] && item['showChildren']" class="pl-6 space-y-2 mt-2">
                    <li *ngFor="let child of item['children']">
                        <a [routerLink]="child.path" class=" flex items-center gap-2 p-2 rounded-lg transition-colors cursor-pointer
                            hover:bg-amber-100 text-slate-700">
                            <i [ngClass]="child.icon"></i>
                            <span>{{ child.label }}</span>
                        </a>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>
</aside>
