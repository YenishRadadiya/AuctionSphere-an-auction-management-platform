<div class="dashboard-container">
    <app-navbar></app-navbar>
    <div class="dashboard-body">
        <app-sidebar></app-sidebar>
        <div class="dashboard-content">
            <div *ngIf="isMainDashboard()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 p-6">
                <!-- Auctions Created -->
                <div
                    class="flex items-center p-6 bg-blue-50 rounded-2xl shadow-lg hover:shadow-xl transition min-h-[120px]">
                    <div class="bg-blue-100 p-4 rounded-full mr-6">
                        <i class="pi pi-plus-circle text-blue-600 text-3xl"></i>
                    </div>
                    <div>
                        <h3 class="text-blue-700 text-lg font-medium">Auctions Created</h3>
                        <p class="text-2xl font-bold text-blue-900">12</p>
                    </div>
                </div>

                <!-- Participated Auctions -->
                <div
                    class="flex items-center p-6 bg-green-50 rounded-2xl shadow-lg hover:shadow-xl transition min-h-[120px]">
                    <div class="bg-green-100 p-4 rounded-full mr-6">
                        <i class="pi pi-users text-green-600 text-3xl"></i>
                    </div>
                    <div>
                        <h3 class="text-green-700 text-lg font-medium">Participated in Auctions</h3>
                        <p class="text-2xl font-bold text-green-900">8</p>
                    </div>
                </div>

                <!-- Products Listed -->
                <div
                    class="flex items-center p-6 bg-yellow-50 rounded-2xl shadow-lg hover:shadow-xl transition min-h-[120px]">
                    <div class="bg-yellow-100 p-4 rounded-full mr-6">
                        <i class="pi pi-box text-yellow-600 text-3xl"></i>
                    </div>
                    <div>
                        <h3 class="text-yellow-700 text-lg font-medium">Products Listed</h3>
                        <p class="text-2xl font-bold text-yellow-900">15</p>
                    </div>
                </div>

                <!-- Auctions Won -->
                <div
                    class="flex items-center p-6 bg-purple-50 rounded-2xl shadow-lg hover:shadow-xl transition min-h-[120px]">
                    <div class="bg-purple-100 p-4 rounded-full mr-6">
                        <i class="pi pi-star text-purple-600 text-3xl"></i>
                    </div>
                    <div>
                        <h3 class="text-purple-700 text-lg font-medium">Auctions Won</h3>
                        <p class="text-2xl font-bold text-purple-900">3</p>
                    </div>
                </div>
                <!-- Highest Bid -->
                <div
                    class="flex items-center p-6 bg-red-50 rounded-2xl shadow-lg hover:shadow-xl transition min-h-[120px]">
                    <div class="bg-red-100 p-4 rounded-full mr-6">
                        <i class="pi pi-money-bill text-red-600 text-3xl"></i>
                    </div>
                    <div>
                        <h3 class="text-red-700 text-lg font-medium">Highest Bid</h3>
                        <p class="text-2xl font-bold text-red-900">₹12,500</p>
                    </div>
                </div>
            </div>
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
